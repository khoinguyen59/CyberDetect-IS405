version: '3.8'

# =============================================================================
# CyberDetect-MLP Big Data Pipeline
# Paper: "CyberDetect MLP: A Big Data Enabled Optimized Deep Learning Framework"
# Pipeline: CSV → Kafka → HDFS → Spark preprocessing → Parquet → MLP
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Zookeeper (required by Kafka)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cyberdetect-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cyberdetect-net

  # ---------------------------------------------------------------------------
  # Apache Kafka — Real-time ingestion (Paper L511, L634)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cyberdetect-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - cyberdetect-net

  # ---------------------------------------------------------------------------
  # HDFS NameNode — Distributed storage (Paper L545, L629)
  # ---------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: cyberdetect-namenode
    ports:
      - "9870:9870"   # Web UI
      - "9000:9000"   # HDFS RPC
    environment:
      CLUSTER_NAME: cyberdetect
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - cyberdetect-net

  # ---------------------------------------------------------------------------
  # HDFS DataNode — Storage node (Paper L629-630)
  # ---------------------------------------------------------------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: cyberdetect-datanode
    depends_on:
      - namenode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - cyberdetect-net

  # ---------------------------------------------------------------------------
  # Spark Master — Distributed processing (Paper L512, L641)
  # ---------------------------------------------------------------------------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: cyberdetect-spark-master
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark Master RPC
    environment:
      INIT_DAEMON_STEP: setup_spark
    networks:
      - cyberdetect-net

  # ---------------------------------------------------------------------------
  # Spark Workers — Paper: "1 master, 4 workers" (L1021-1025)
  # ---------------------------------------------------------------------------
  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: cyberdetect-spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    networks:
      - cyberdetect-net

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: cyberdetect-spark-worker-2
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    networks:
      - cyberdetect-net

  spark-worker-3:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: cyberdetect-spark-worker-3
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    networks:
      - cyberdetect-net

  spark-worker-4:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: cyberdetect-spark-worker-4
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    networks:
      - cyberdetect-net

  # ---------------------------------------------------------------------------
  # Apache Flume — Batch log ingestion (Paper L546, L636)
  # "Apache Flume facilitates batch data ingestion from log files"
  # ---------------------------------------------------------------------------
  flume:
    image: probablyfine/flume:latest
    container_name: cyberdetect-flume
    depends_on:
      - namenode
    volumes:
      - ./flume/flume.conf:/opt/flume/conf/flume.conf
      - ./flume/spool:/var/log/flume/spool
    command: >
      flume-ng agent
      --conf /opt/flume/conf
      --conf-file /opt/flume/conf/flume.conf
      --name agent1
      -Dflume.root.logger=INFO,console
    networks:
      - cyberdetect-net

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  cyberdetect-net:
    driver: bridge
