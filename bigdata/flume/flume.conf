# =============================================================================
# Apache Flume Agent Configuration — CyberDetect-MLP
# Paper ref: L546 "Apache Flume facilitates batch data ingestion from log files"
# Paper ref: L636 "Flume for batch ingestion of historical log files into HDFS"
#
# Pipeline: Spool directory → Flume agent → HDFS
# Place CSV files in flume/spool/ → Flume picks up and writes to HDFS
# =============================================================================

# Agent name
agent1.sources = spool-source
agent1.channels = mem-channel
agent1.sinks = hdfs-sink

# ---------------------------------------------------------------------------
# Source: Spooling Directory
# Watches flume/spool/ for new CSV files (e.g., ton_iot.csv)
# ---------------------------------------------------------------------------
agent1.sources.spool-source.type = spooldir
agent1.sources.spool-source.spoolDir = /var/log/flume/spool
agent1.sources.spool-source.fileHeader = true
agent1.sources.spool-source.basenameHeader = true
agent1.sources.spool-source.channels = mem-channel

# ---------------------------------------------------------------------------
# Channel: Memory Channel (buffering between source and sink)
# ---------------------------------------------------------------------------
agent1.channels.mem-channel.type = memory
agent1.channels.mem-channel.capacity = 100000
agent1.channels.mem-channel.transactionCapacity = 10000

# ---------------------------------------------------------------------------
# Sink: HDFS
# Writes ingested data to hdfs://namenode:9000/cyberdetect/raw/
# ---------------------------------------------------------------------------
agent1.sinks.hdfs-sink.type = hdfs
agent1.sinks.hdfs-sink.hdfs.path = hdfs://namenode:9000/cyberdetect/raw
agent1.sinks.hdfs-sink.hdfs.fileType = DataStream
agent1.sinks.hdfs-sink.hdfs.writeFormat = Text
agent1.sinks.hdfs-sink.hdfs.rollInterval = 60
agent1.sinks.hdfs-sink.hdfs.rollSize = 67108864
agent1.sinks.hdfs-sink.hdfs.rollCount = 0
agent1.sinks.hdfs-sink.hdfs.batchSize = 1000
agent1.sinks.hdfs-sink.hdfs.filePrefix = toniot
agent1.sinks.hdfs-sink.hdfs.fileSuffix = .csv
agent1.sinks.hdfs-sink.channel = mem-channel
